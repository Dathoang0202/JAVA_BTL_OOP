spring.application.name=project
server.port=8080

# =========================================================================
# CAU HINH KET NOI MYSQL WORKBENCH
# =========================================================================
# Neu ban dung MySQL, hay dien dung mat khau MySQL cua may ban vao day:
spring.datasource.url=jdbc:mysql://localhost:3306/learning_progress_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
